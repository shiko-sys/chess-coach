<!doctype html>
<html lang="en" data-mode="phone" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Chess Coach</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="report.css">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Chess Coach">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><img src="icon.svg" alt=""></div><div><b>Chess Coach</b><span id="brand-user"></span></div></div>
    <nav class="nav-list" id="nav-list" aria-label="Sections"></nav>
    <div class="side-foot">
      <button class="sync" id="sync" type="button"></button>
      <button class="nav" id="nav-settings" type="button" data-go="settings"></button>
    </div>
  </aside>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="pop" id="pop" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="tip" role="tooltip"></div>
<script type="module" src="js/main.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
